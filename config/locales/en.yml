en:
    hello: "Hello world"
    intro_title: "Learning About My Treatment Options for Lupus"
    intro_data_1: "This guide is for people with moderate to severe lupus."
    intro_data_2: "This guide is for people with less severe lupus."
    intro_data_3: " What you learn in this guide will help you understand what is most important to you while deciding with your doctor how to manage your lupus."


    data_1: "Is this information only for women with lupus?"
    data_2: "Lupus affects more women than men."
    data_3: "This information is as applicable to both, men and women, with lupus."
    data_4: "Some information within this guide is solely for women, but those sections may be skipped."
    data_5: "All medications for lupus are available to both men and women with lupus."
    data_6: "Why did I get internal organ disease from lupus?"
    data_7: "No one knows why some people with lupus get internal organ disease and others do not, although, both genes and environmental factors may play a role."
    data_8: "Lupus can cause disease in many organs, including the brain, heart, lung, and kidneys."
    data_9: "While different organs can be affected by lupus, the kidneys are the most commonly involved."
    data_10: "One of the most common problems patients face is how to treat lupus kidney disease."
    data_11: "We now have more than one way to treat kidney disease caused by lupus."
    data_12: "This guide will first describe how lupus affects the kidneys, then help you and your doctor talk about the different treatments."
    data_13: "Learning about these treatments will also help you learn about treatment for lupus involving other organs."
    data_14: "How does lupus affect the kidneys?"
    data_15: "Your immune system fights off germs, like viruses and bacteria."
    data_16: "When you have lupus, your immune system is overactive. Instead of only attacking germs, it also attacks your body's healthy tissues."
    data_17: "If your kidneys are attacked, they can become damaged."
    data_18: "Treatment works to calm your immune system so that it stops attacking your kidneys."
    data_19: "Why is it important to protect my kidneys?"
    data_20: "Kidneys are needed to sustain life."
    data_21: "Your kidneys: \n   -Are in the back of your abdomen\n   -Keep your body clean by getting rid of waste.\n   -Keep all the chemicals in your body balanced.\n   -Get rid of extra fluid."
    data_22: "If they don't work well enough, dialysis machines should be used to get rid of waste and extra fluid."
    data_23: "How is lupus kidney disease treated?"
    data_24: "Lupus kidney (and other organ) disease is treated with a combination of steroids and an immunosuppressive. \n   - Steroids are used for a few months.\n   - Immunosuppressive medication is continued for a total of at least 3-5 years."
    data_25: "Many large studies have shown that these medications work better together than alone."
    data_26: "I am concerned about taking medications for such a long time."
    data_27: "Many people feel that taking medications for a long time is not good for their health."
    data_28: "If you feel this way, tell your doctor."
    data_29: "You may be more comfortable agreeing to start treatment, then decide whether or not to continue, depending on your progress."
    data_30: "What if the medication interferes with my daily life?"
    data_31: "Many people worry that taking medications will make them feel bad and not allow them to keep up with their normal lives."
    data_32: "The truth is that most people taking these medications will not get any side effects."
    data_33: "Treatments commonly used for lupus skin disease are: Hydroxychloroquine (Plaquenil), Creams and ointments, and Quinacrine"
    data_34: "What other people say about serious lupus disease"
    data_35: "Having my family be a part of this is a great help."
    data_36: "Make sure your doctor explains things in a simple way."
    data_37: "I am worried that I will always have to take these drugs."
    data_38: "I still want to have as normal a life as I can, so I think the medications are worth a try."
    data_39: "Think about all of your questions and write them down."
    data_40: "The main thing is that I just want to get better!"
    data_41: "What else can I do to help myself?"
    data_42: "Ask family and friends for help with errands or chores."
    data_43: "Put together a strong support system."
    data_44: "Reach out to others when needed."
    data_45: "Find out if there is a Lupus support group in your area. No one understands serious lupus better than people who have gone through it before."
    data_46: "Read about helpful tips on the Lupus Foundation website."
    data_47: "Will these medicines cause harm to my other vital organs?"
    data_48: "Many people have this concern."
    data_49: "When lupus is not well controlled, your immune system is overactive and may harm your vital organs."
    data_50: "Immunosuppressives act by improving the immune system's balance and preventing your own immune system from attacking your vital organs."
    data_51: "Bottom Line"
    data_52: "Without treatment, lupus can be a very serious disease."
    data_53: "Cytoxan and Cellcept protect your kidneys and other organs from lupus."
    data_54: "When taking immunosuppressives, the benefit of saving your kidneys and other organs outweighs the risk."
    data_55: "Most side effects are temporary."
    data_56: "If needed, your doctor can change the dose to reduce the side effects."
