    data_87: "Steroids"
    data_88: "Once lupus kidney (or other organ) disease is diagnosed, treatment with steroids is started."
    data_89: "Some patients know these medications as: Prednisone, Solumedrol, and Medrol."
    data_90: "The main advantage of steroids is that they start to work right away."
    data_91: "Many people with lupus already know a lot about steroids."
    data_92: "Side effects of Steroids"
    data_93: "Many people worry about the side effects from steroids."
    data_94: "Your doctor will prescribe the lowest dose possible to minimize side effects."
    data_95: "Changes in Your Physical Appearance"
    data_96: "Some people worry about changes in their physical appearance, such as, weight gain, stretch marks, a puffy face or acne."
    data_97: "Weight Gain"
    data_98: "Some people gain weight while on steroids."
    data_99: "This can happen in about 70 out of 100 people."
    data_100: "Stretch Marks"
    data_101: "Some people get stretch marks while taking steroids."
    data_102: "This can happen in 24 out of 100 people. "
    data_103: "There are treatments available that can help them fade. "
    data_104: "Puffy face"
    data_105: "Some people report a puffy face while taking steroids."
    data_106: "This can happen in 24 out of 100 people."
    data_107: "Facial puffiness goes away after you stop taking steroids."
    data_108: "Acne"
    data_109: "Some people get acne, or frequent breakouts, while taking steroids."
    data_110: "This can happen in 18 out of 100 people."
    data_111: "Acne goes away after you stop taking steroids."
    data_112: "Feeling Low"
    data_113: "Some people feel low, and irritable or anxious while taking steroids."
    data_114: "Feeling low or anxious can happen in 19 out of 100 people."
    data_115: "There are many things that you can do to deal with these feelings."
    data_116: "Weakened Bones"
    data_117: "Steroids can also weaken your bones."
    data_118: "When your bones become weak, they can break more easily."
    data_119: "Weakening of bones happens in 18 out of 100 people taking steroids."
    data_120: "Risk of Serious Infections"
    data_121: "Steroids can increase your risk of serious infections, like pneumonia."
    data_122: "In many cases, this will require that you are treated with antibiotics in a hospital."
    data_123: "3 out of 100 people on steroids have a serious infection."
    data_124: "If steroids work, why do I need a second medication?"
    data_125: "Steroids work fast, but they aren't good at making sure that the kidneys or other organs continue to function well in the long-term."
    data_126: "Immunosupprpressives, on the other hand, have been shown to preserve organ function and prevent damage over many years."
    data_127: "Immunosuppressives also decrease complications and the risk of death from serious lupus disease."
    data_128: "The Main Facts About Immunosuppressives"
    data_129: "Immunosuppressives allow your doctor to prescribe lower doses of steroids which means decreases in weight gain, infections, and bone loss."
    data_130: "Most treatment-related side effects that occur in lupus patients are from steroids, not from immunosuppressives."
    data_131: "Reviewing the Facts About Cytoxan and Cellcept"
    data_132: "You may have taken these medications before."
    data_133: "This guide will present information from studies which looked at people just like you, who need to switch medication becuase their kidney (and other organ) disease is not improving on their current medications."
    data_134: "Reviewing the Facts About Cytoxan and Calcineurin-inhibitors (also called CIs)"
    data_135: "This guide will present information from studies which looked at people just like you, who need to switch medication becuase their kidney (and other organ) disease is not improving on their current medications."
    data_136: "Reviewing the Facts About Cytoxan and Imuran"
    data_137: "You may have taken these medications before."
    data_138: "This guide will present information from studies which looked at people just like you, who need to switch medication because their kidney (and other organ) disease is not improving on their current medications."
    data_139: "What do I need to know about immunosuppressives?"
    data_140: "There are 2 immunosuppressives available for the first 6 months of treatment:\n- Cytoxan: the generic name is cyclophosphamide.\n- Cellcept: the generic name is mycophenolate."
    data_141: "You and your doctor will choose which medication to start for the first 6 months."
    data_142: "After 6 months, almost all patients take Cellcept."
    data_143: "Treatment usually lasts for 3-5 years."
    data_144: "What do I need to know about immunosuppressives?"
    data_145: "There are 2 immunosuppressives available for the first 6 months of treatment:\n   - Cytoxan: the generic name is cyclophosphamide.\n   - Cellcept: the generic name is mycophenolate."
    data_146: "You and your doctor will choose which medication to start for the first 6 months."
    data_147: "Treatment usually lasts for 3-5 years."
    data_148: "Is this information on immunosuppressives only for people with lupus kidney disease?"
    data_149: "Most research on immunosuppressive treatments for lupus focused on kidney disease."
    data_150: "The same treatments are used for treatment of serious lupus disease in other parts of the body, including the heart, lung and brain."
    data_151: "The next few screens present the effects of immunosuppressive treatments for kidneys, but most information also applies to other forms of serious lupus disease."
    data_152: "Other treatments are discussed later in this guide."
    data_153: "Cytoxan"
    data_154: "Cytoxan is also known as Cyclophosphamide."
    data_155: "This medication may be given as an IV infusion that takes 15 to 60 minutes to administer. It can also be taken as pills."
    data_156: "Cellcept"
    data_157: "Cellcept, also known as Mycophenolate, may be used an alternative medication."
    data_158: "This medication is given as a capsule or tablet."
    data_159: "Treatment Timeline for Immunosuppressives"
    data_160: "Are these medicines expensive?"
    data_161: "Being able to afford your medicine is a concern for most people. There are many ways to get the medicine you need."
    data_162: "Cytoxan and Cellcept are covered by most insurance plans."
    data_163: "Generic medicines that cost less are available."
    data_164: "Check with your pharmacist for recommended programs that may reduce or cover the cost."
