    data_459: "What treatments can help lupus skin disease?"
    data_460: "Two-third of all lupus patients have some form of skin disease"
    data_461: "Skin disease usually gets worse in the sun"
    data_462: "Treatments commonly used for lupus skin disease are: Hydroxychloroquine (Plaquenil), Creams and ointments, and Quinacrine"
    data_463: "Creams for Lupus Skin Disease"
    data_464: "The most commonly used topicals are steroid creams or gels"
    data_465: "Sometimes steroids are injected into the skin"
