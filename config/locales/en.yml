    data_229: "What if I don't see any positive effects from taking the medication?"
    data_230: "Your doctor will monitor how well you are responding to the medications by checking blood and urine for a test called creatinine, which shows how well your kidneys are doing."
    data_231: "If the medications are not working as expected, your doctor will talk to you about switching to a different treatment."
    data_232: "Hair Changes"
    data_233: "Some people may experience hair changes while taking Cytoxan or Cellcept."
    data_234: "Hair changes are usually limited to hair thinning. Sometimes, the thinning occurs in patches."
    data_235: "30 out of a 100 people experience these problems on Cytoxan and 9 out of 100 people have hair changes on Cellcept."
    data_236: "This effect is temporary; and hair grows back when treatment is stopped."
    data_237: "Hair changes are more common with Cytoxan than Cellcept."
    data_238: "Lupus, itself, may also cause hair loss."
