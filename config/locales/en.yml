    data_431: "Biologic Lupus Treatments"
    data_432: "Biologics neutralize molecules that cause inflammation in lupus."
    data_433: "There are several biologics available, only two are approved by the FDA for treatment of Lupus: -Belimumab or Benlysta (FDA approved for Lupus) \n-Rituximab or Rituxan \n-Abatacept or Orencia \n-Anifrolumab or Saphnelo (FDA approved for Lupus)"
    data_434: "These medications are given by an injection under your skin or by an infusion in your doctor's office or an infusion center."
    data_435: "Treatment usually lasts a few months to a few years."
    data_436: "Certain vaccines should not be given to people taking biolgoics. If possible, they are given before starting these medications."
    data_437: "Belimumab (also called Benlysta)"
    data_438: "Belimumab is a biologic drug, approved for lupus by the FDA."
    data_439: "It is given as monthly infusion or weekly injection."
    data_440: "It controls active lupus in skin, joints and other body organs and improves quality of life and function."
    data_441: "But, it has not been studied in people with serious organ disease."
    data_442: "Belimumab has rare side effects, such as:\n- Infusion reaction while receiving the infusion such as skin itching or rash.\n- Rarely, infusion reactions can be severe and cause hives, headache, chills, fever, shortness of breath, throat or tongue swelling, diffuclty breathing and a drop in blood pressure\n- Depression\n- Serious infections"
    data_443: "belimumab_infection"
    data_444: "Belimumab may increase the risk of a serious infection"
    data_445: "6 out of 100 people who take Belimumab get a serious infection, like pneumonia, compared to 5 out of 100 receiving placebo"
    data_446: "Rituximab (also called Rituxan)"
    data_447: "Rituximab is a biologic drug."
    data_448: "It is given as 2 infusions every 2 weeks apart. It works for 6-9 months. It can be given again if needed."
    data_449: "It can control serious lupus disease in blood vessels, skin, joints and other organs. It also improved the quality of life and function."
    data_450: "Rituximab has side effects, such as:\n- IF you have Hepatitis B, it can get activated again\n- Infusion reaction while receiving the infusion such as skin itching or rash\n- Rarely, infusion reactions can be severe and cause hives, headache, chills, fever, shortness of breath, throat or tongue swelling, difficulty breathing and drop in blood pressure\n- Serious infections"
    data_451: "Rituximab may increase the risk of a serious infection"
    data_452: "2 out of 100 people who take Rituximab get serious infection like pneumonia each year, compared to 1 out of 100 getting placebo."
    data_453: "Abatacept (also called Orencia)"
