    data_322: "Answer questions commonly asked by people with lupus kidney and other organ diseases."
    data_323: "Should I add this new medication on top of my existing medication for lupus kidney disease?"
    data_324: "Your doctor likely has already recommended Cytoxan or Cellcept to help your kidneys."
    data_325: "Adding this second approved medication may increase the chances of complete control of your lupus."
