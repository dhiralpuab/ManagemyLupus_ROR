    data_468: "Lupus Skin Disease Treatments : Hydroxychloroquine"
    data_469: "Hydroxychloroquine (also called Plaquenil)"
    data_470: "Hydroxychloroquine is taken as one or more pills daily."
    data_471: "It is a very effective treatment for lupus skin disease."
    data_472: "Hydroxychloroquine also has other benefits: it treats fatigue and joint pain, It decreases organ damage due to lupus, It decreases the risk of blood clots, It improves good cholesterol and lowers bad cholesterol, and it is safe to use during pregnancy."
    data_473: "It decreases the risk of death due to lupus"
    data_474: "Hydroxychloroquine also reduces the risk of flares, and so doctors recommend that all patients with lupus take it over the long-term."
    data_475: "Hydroxychloroquine can rarely cause vision problems. To prevent this, you will be monitored by an eye doctor."
    data_476: "Quinacrine (also called Atabrine)"
    data_477: "Quinacrine is taken as 1 pill once a day."
    data_478: "It is used if hydroxychloroquine didn't work well enough for lupus skin disease or if hydroxychloroquine is not tolerated."
    data_479: "Quinacrine's side effects include: Diarrhea, nausea, stomach upset, dizziness, yellow skin discoloration, and skin rash with itching, that can sometimes be severe."
    data_480: "What treatments can help lupus joint disease?"
    data_481: "Joint pains are commonly treated with Tylenol or anti-inflammatory drugs (e.g., Ibuprofen) and hydroxychloroquine."
    data_482: "When prescribed medications are needed, your doctor may talk to you about: Methotrexate (Trexall or Rasuvo), Leflunomide (or Arava), Azathioprine (or Imuran), or Mycophenolate (or Cellcept)."
