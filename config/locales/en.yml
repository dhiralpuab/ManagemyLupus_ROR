    data_213: "Kidney failure is prevented in 92 out of 100 people taking Cytoxan and in 82 out of 100 people taking Imuran over 5 years."
    data_214: "The difference in these numbers may be due to chance."
    data_215: "Reduce Lupus Kidney Flare"
    data_216: "Both Cytoxan and Cellcept are very good at reducing the chance of having a lupus kidney flare."
    data_217: "Kidney flares are reduced in 90 out of 100 people taking Cytoxan, and in 88 out of 100 taking Cellcept."
    data_218: "The small difference in these numbers may be due to chance."
