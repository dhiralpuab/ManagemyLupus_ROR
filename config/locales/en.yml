    data_195: "Improve Kidney Function"
    data_196: "Both Cytoxan and Cellcept are good at calming down your immune system and allowing your kidneys to heal."
    data_197: "Kidney function improves in 59 out of 100 people who take Cytoxan and in 62 out of 100 people who take Cellcept."
    data_198: "The difference in these numbers may be due to chance."
    data_199: "Improve Kidney Function"
    data_200: "Both Cytoxan and CIs are good at calming down your immune system and allowing your kidneys to heal."
    data_201: "59 out of 100 people have improved kideny function while on Cytoxan and 46 out of 100 people on CIs."
    data_202: "The difference in these numbers may be due to chance."
    data_203: "Improve Kidney Function"
    data_204: "Both Cytoxan and Imuran are good at calming down your immune system and allowing your kidneys to heal."
    data_205: "Kidney function improves in 79 out of 100 people who take Cytoxan and in 71 out of 100 people who take Imuran."
    data_206: "The difference in these numbers may be due to chance."
    data_207: "Prevent Kidney Failure"
    data_208: "The ultimate benefit of taking immunosuppressives is the prevention of kidney failure or the need for dialysis."
    data_209: "Kidney failure is prevented in 98 out of 100 people taking Cytoxan and in 94 out of 100 people taking Cellcept."
    data_210: "The difference in these numbers may be due to chance."
    data_211: "Prevent Kidney Failure"
