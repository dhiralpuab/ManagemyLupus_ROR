- id: 5
  title: Why did I get internal organ disease from lupus?
  image_url: woman_sitting.jpeg
  description:
  - No one knows why some people with lupus get internal organ disease and others
    do not, although, both genes and environmental factors may play a role.
  - Lupus can cause disease in many organs, including the brain, heart, lung, and
    kidneys.
  - While different organs can be affected by lupus, the kidneys are the most commonly
    involved.
  - One of the most common problems patients face is how to treat lupus kidney disease.
  - We now have more than one way to treat kidney disease caused by lupus.
  - This guide will first describe how lupus affects the kidneys, then help you and
    your doctor talk about the different treatments.
  - Learning about these treatments will also help you learn about treatment for lupus
    involving other organs.
  categories:
  - active_kidneys
  learn_more:
  learn_more_id:
  hidden: false
- id: 6
  title: How does lupus affect the kidneys?
  image_url: woman.jpeg
  description:
  - Your immune system fights off germs, like viruses and bacteria.
  - When you have lupus, your immune system is overactive. Instead of only attacking
    germs, it also attacks your body's healthy tissues.
  - If your kidneys are attacked, they can become damaged.
  - Treatment works to calm your immune system so that it stops attacking your kidneys.
  categories:
  - active_kidneys
  learn_more:
  learn_more_id:
  hidden: false
- id: 7
  title: Why is it important to protect my kidneys?
  image_url: woman.jpeg
  description:
  - Kidneys are needed to sustain life.
  - "Your kidneys: \n   -Are in the back of your abdomen\n   -Keep your body clean
    by getting rid of waste.\n   -Keep all the chemicals in your body balanced.\n
    \  -Get rid of extra fluid."
  - If they don't work well enough, dialysis machines should be used to get rid of
    waste and extra fluid.
  categories:
  - active_kidneys
  learn_more:
  learn_more_id:
  hidden: false
- id: 8
  title: How is lupus kidney disease treated?
  image_url: woman.jpeg
  description:
  - "Lupus kidney (and other organ) disease is treated with a combination of steroids
    and an immunosuppressive. \n   - Steroids are used for a few months.\n   - Immunosuppressive
    medication is continued for a total of at least 3-5 years."
  - Many large studies have shown that these medications work better together than
    alone.
  categories:
  - active_kidneys
  learn_more:
  learn_more_id:
  hidden: false
- id: 9
  title: I am concerned about taking medications for such a long time.
  image_url: woman.jpeg
  description:
  - Many people feel that taking medications for a long time is not good for their
    health.
  - If you feel this way, tell your doctor.
  - You may be more comfortable agreeing to start treatment, then decide whether or
    not to continue, depending on your progress.
  categories:
  - active_kidneys
  learn_more:
  learn_more_id:
  hidden: false
- id: 10
  title: What if the medication interferes with my daily life?
  image_url: woman_smile.jpeg
  description:
  - Many people worry that taking medications will make them feel bad and not allow
    them to keep up with their normal lives.
  - The truth is that most people taking these medications will not get any side effects.
  - 'Treatments commonly used for lupus skin disease are: Hydroxychloroquine (Plaquenil),
    Creams and ointments, and Quinacrine'
  categories:
  - active_kidneys
  - quiet
  learn_more:
