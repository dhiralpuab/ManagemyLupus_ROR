  hidden: false
- id: 11
  title: What other people say about serious lupus disease
  image_url: group_photo.jpeg
  description:
  - Having my family be a part of this is a great help.
  - Make sure your doctor explains things in a simple way.
  - I am worried that I will always have to take these drugs.
  - I still want to have as normal a life as I can, so I think the medications are
    worth a try.
  - Think about all of your questions and write them down.
  - The main thing is that I just want to get better!
