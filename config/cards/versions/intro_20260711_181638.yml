- id: 4
  title: Is this information on immunosuppressives only for people with lupus kidney
    diseases?
  image_url: no_image.png
  description:
  - Most research on immunosuppressive treatments for lupus focused on kidney disease.
  - The same treatments are used for treatment of serious lupus disease in other parts
    of the body, including the heart, lung and brain.
  - The next few screens present the effects of immunosuppressive treatments for kidneys,
    but most information also applies to other forms of serious lupus disease.
  - One can replace the word “kidney” with “brain”, “lung” or “vital organ” for most
    of the treatment information.
  - Other treatments are discussed later in this guide.
  categories: []
