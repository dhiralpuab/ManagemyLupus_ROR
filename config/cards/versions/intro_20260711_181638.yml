- id: 12
  title: Will these medicines cause harm to my other vital organs?
  image_url: elderly.jpg
  description:
  - Many people have this concern.
  - When lupus is not well controlled, your immune system is overactive and may harm
    your vital organs.
  - Immunosuppressives act by improving the immune system's balance and preventing
    your own immune system from attacking your vital organs.
  categories:
  - active_kidneys
  learn_more:
  learn_more_id:
  hidden: false
- id: 13
  title: Bottom Line
  image_url: woman.jpeg
  description:
  - Without treatment, lupus can be a very serious disease.
  - Cytoxan and Cellcept protect your kidneys and other organs from lupus.
  - When taking immunosuppressives, the benefit of saving your kidneys and other organs
    outweighs the risk.
  - Most side effects are temporary.
  - If needed, your doctor can change the dose to reduce the side effects.
  categories:
  - a
  - b
  learn_more:
  learn_more_id:
  hidden: false
